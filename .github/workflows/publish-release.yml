name: Publish signed release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VERSION: "0.4.0"
      TAG: "v0.4.0"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and verify source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/MorningBriefAndroid-v0.4.0.zip"
          cat source/v0.4.0.b64/part-*.txt | base64 -d > "$ZIP"
          echo "aa5cd8db0d9a2f2e153d1fe67cd7555619e6e3e01680f84abde263f13f2e8111  $ZIP" | sha256sum -c -
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc
          echo "APP_DIR=$(find buildsrc -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"

      - name: Restore existing Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Repository secret ANDROID_DEBUG_KEYSTORE_B64 is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build unsigned release APK
        run: gradle -p "$APP_DIR" :app:assembleRelease

      - name: Align, sign, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="$APP_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/TheDailyBrief-v$VERSION-aligned.apk"
          SIGNED="$RUNNER_TEMP/TheDailyBrief-v$VERSION.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" -f -v 4 "$UNSIGNED" "$ALIGNED"

          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/debug.keystore"             --ks-key-alias androiddebugkey             --ks-pass pass:android             --key-pass pass:android             --out "$SIGNED"             "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$TAG" "$SIGNED_APK#TheDailyBrief-v$VERSION.apk"             --target "$GITHUB_SHA"             --title "The Daily Brief v$VERSION"             --notes "v0.4.0 replaces the fixed ten-story edition with editorial scoring and a quality cutoff, adds duplicate clustering and source/topic diversity penalties, adds build progress feedback, and improves dark-mode Settings contrast."

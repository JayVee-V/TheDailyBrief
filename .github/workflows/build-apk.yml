name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source/v0.4.0.b64/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct and verify v0.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          ZIP="/tmp/MorningBriefAndroid-v0.4.0.zip"
          cat source/v0.4.0.b64/part-*.txt | base64 -d > "$ZIP"
          echo "aa5cd8db0d9a2f2e153d1fe67cd7555619e6e3e01680f84abde263f13f2e8111  $ZIP" | sha256sum -c -
          unzip -t "$ZIP"
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc
          echo "APP_DIR=$(find buildsrc -mindepth 1 -maxdepth 1 -type d | head -1)" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle -p "$APP_DIR" :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TheDailyBrief-v0.4.0-debug-apk
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/app-debug.apk

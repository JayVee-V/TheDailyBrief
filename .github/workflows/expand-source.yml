name: Build Weekend Reading test APK

on:
  push:
    branches: [feature/weekend-reading]
    paths:
      - 'expanded/**'
      - '.github/workflows/expand-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build test APK
        run: gradle -p expanded :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WeekendReading-debug-apk
          path: expanded/app/build/outputs/apk/debug/app-debug.apk

name: Inspect v0.4.1 source

on:
  push:
    branches: [ inspect-v042 ]
    paths:
      - '.github/workflows/inspect-v042.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reconstruct source and print relevant files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/MorningBriefAndroid-v0.4.0.zip"
          cat source/v0.4.0.b64/part-*.txt | base64 -d > "$ZIP"
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc
          APP_DIR="$(find buildsrc -mindepth 1 -maxdepth 1 -type d | head -1)"
          patch -d "$APP_DIR" -p1 < source/patches/v0.4.1.patch
          echo "===== EditionEngine.java ====="
          cat "$APP_DIR/app/src/main/java/org/morningbrief/app/EditionEngine.java"
          echo "===== SettingsStore.java ====="
          cat "$APP_DIR/app/src/main/java/org/morningbrief/app/SettingsStore.java"
          echo "===== MainActivity.java ====="
          cat "$APP_DIR/app/src/main/java/org/morningbrief/app/MainActivity.java"
          echo "===== EditionBuilder.java ====="
          cat "$APP_DIR/app/src/main/java/org/morningbrief/app/EditionBuilder.java"

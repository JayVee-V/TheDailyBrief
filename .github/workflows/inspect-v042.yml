name: Validate v0.4.2

on:
  push:
    branches: [ inspect-v042 ]
    paths:
      - '.github/workflows/inspect-v042.yml'
      - 'source/patches/v0.4.2.patch'

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct, patch, and build v0.4.2
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/MorningBriefAndroid-v0.4.0.zip"
          cat source/v0.4.0.b64/part-*.txt | base64 -d > "$ZIP"
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q "$ZIP" -d buildsrc
          APP_DIR="$(find buildsrc -mindepth 1 -maxdepth 1 -type d | head -1)"
          patch -d "$APP_DIR" -p1 < source/patches/v0.4.1.patch
          patch -d "$APP_DIR" -p1 < source/patches/v0.4.2.patch
          grep -q 'versionName = "0.4.2"' "$APP_DIR/app/build.gradle.kts"
          gradle -p "$APP_DIR" :app:assembleDebug

name: Publish v0.6.0 test release

on:
  push:
    branches: [ main ]
    paths:
      - '.release/v0.6.0-test.1'
      - '.github/workflows/publish-v060-test.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VERSION: "0.6.0-test.1"
      TAG: "v0.6.0-test.1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify test version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.6.0-test.1"' expanded/app/build.gradle.kts
          grep -q 'versionCode = 12' expanded/app/build.gradle.kts

      - name: Restore existing Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Repository secret ANDROID_DEBUG_KEYSTORE_B64 is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build unsigned release APK
        run: gradle -p expanded :app:assembleRelease

      - name: Align, sign, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="expanded/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/TheDailyBrief-v$VERSION-aligned.apk"
          SIGNED="$RUNNER_TEMP/TheDailyBrief-v$VERSION.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$TAG" "$SIGNED_APK#TheDailyBrief-v$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "The Daily Brief $VERSION" \
            --prerelease \
            --notes "Phone test for the personal-reader update: bottom navigation with Morning Brief, Funnies & Puzzles, and Weekend Reading; tab-specific Settings; Morning Brief rebuild moved into Settings; feels-like temperatures; deafkitten's Imgur posts; Mini Crossword; and Daily Logic Puzzles."

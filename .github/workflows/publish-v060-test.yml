name: Publish signed v0.7.0 test release

on:
  push:
    branches: [ main ]
    paths:
      - '.release/v0.7.0-test.6'
      - '.github/workflows/publish-v060-test.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      VERSION: "0.7.0-test.6"
      TAG: "v0.7.0-test.6"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify test version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.7.0-test.6"' expanded/app/build.gradle.kts
          grep -q 'versionCode = 19' expanded/app/build.gradle.kts

      - name: Restore existing Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Repository secret ANDROID_DEBUG_KEYSTORE_B64 is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Build unsigned release APK
        run: gradle -p expanded :app:assembleRelease

      - name: Align, sign, and verify APK
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="expanded/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/TheDailyBrief-v$VERSION-aligned.apk"
          SIGNED="$RUNNER_TEMP/TheDailyBrief-v$VERSION.apk"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          echo "SIGNED_APK=$SIGNED" >> "$GITHUB_ENV"

      - name: Check update compatibility against installed-version release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download v0.6.0-test.2 --pattern '*.apk' --dir "$RUNNER_TEMP/previous"
          PREVIOUS=$(find "$RUNNER_TEMP/previous" -name '*.apk' -print -quit)
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          CERT_OLD=$("$APKSIGNER" verify --print-certs "$PREVIOUS" | grep 'certificate SHA-256 digest:' | sort)
          CERT_NEW=$("$APKSIGNER" verify --print-certs "$SIGNED_APK" | grep 'certificate SHA-256 digest:' | sort)
          if [ -z "$CERT_OLD" ] || [ "$CERT_OLD" != "$CERT_NEW" ]; then
            echo "::error::Signing certificate differs from v0.6.0-test.2. Refusing to publish."
            exit 1
          fi
          echo "Verified identical signing certificate."

      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$TAG" "$SIGNED_APK#TheDailyBrief-v$VERSION.apk" \
            --target "$GITHUB_SHA" \
            --title "The Daily Brief $VERSION" \
            --prerelease \
            --notes "Daily comics and individually selectable puzzles, with cached public comic images and shared back-page styling. Signing certificate verified against v0.6.0-test.2."
